# ─────────────────────────────────────────────────────────────
# AI Email Approval Agent — Docker Compose
# Services: n8n (port 5679) · Ollama (port 11435)
# Volumes: persistent n8n data · model cache · logs · memory
# Start with: docker compose up -d
# ─────────────────────────────────────────────────────────────

networks:
  email_agent_net:
    driver: bridge

volumes:
  n8n_agent_data:
  ollama_agent_data:

services:

  # ── n8n ─────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_email_agent
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5679}:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:${N8N_PORT:-5679}/
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-admin123}
      - N8N_USER_FOLDER=/home/node/.n8n
      - DB_TYPE=sqlite
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=true
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - N8N_PAYLOAD_SIZE_MAX=32
      - N8N_LOG_LEVEL=info
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET}
      - GMAIL_REFRESH_TOKEN=${GMAIL_REFRESH_TOKEN}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
    volumes:
      - n8n_agent_data:/home/node/.n8n
      - ./workflows:/home/node/workflows
      - ./data:/home/node/data
      - ./logs:/home/node/logs
    networks:
      - email_agent_net
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Ollama ───────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_email_agent
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=2
    volumes:
      - ollama_agent_data:/root/.ollama
    networks:
      - email_agent_net
    # GPU support (uncomment if available):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Model Pull (one-shot init) ───────────────────────────────
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama_agent_init
    restart: "no"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
    volumes:
      - ollama_agent_data:/root/.ollama
    networks:
      - email_agent_net
    depends_on:
      ollama:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting 15s for Ollama to be ready..."
        sleep 15
        echo "Pulling model: ${OLLAMA_MODEL:-llama3.2}"
        ollama pull ${OLLAMA_MODEL:-llama3.2}
        echo "Done."
